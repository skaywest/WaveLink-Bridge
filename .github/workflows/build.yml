name: Build Beatrice Bridge
on:
  push:
    paths:
      - "src/BeatriceBridge/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/BeatriceBridge/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Validate example configuration
        shell: pwsh
        run: |
          $config = Get-Content src/BeatriceBridge/bridge.example.json -Raw | ConvertFrom-Json
          if ($config.hotkeys.Count -lt 1) { throw "No hotkeys configured" }
      - name: Build and publish win-x64
        run: dotnet publish .\src\BeatriceBridge\BeatriceBridge.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true
      - name: Verify publish contents
        shell: pwsh
        run: |
          $publish = "src/BeatriceBridge/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$publish/BeatriceBridge.exe")) { throw "Missing BeatriceBridge.exe" }
          if (-not (Test-Path "$publish/bridge.example.json")) { throw "Missing bridge.example.json" }
          Get-Content "$publish/bridge.example.json" -Raw | ConvertFrom-Json | Out-Null
          $program = Get-Content "src/BeatriceBridge/Program.cs" -Raw
          if ($program -notmatch 'bridge\.example\.json') { throw "Program does not contain the example-config fallback" }
      - name: Smoke test published executable
        shell: pwsh
        run: |
          $publish = "src/BeatriceBridge/bin/Release/net8.0-windows/win-x64/publish"
          $process = Start-Process -FilePath "$publish/BeatriceBridge.exe" -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 3) { throw "Expected exit code 3 when Beatrice API is unavailable; got $($process.ExitCode)" }
      - name: Test invalid configuration rejection
        shell: pwsh
        run: |
          $publish = "src/BeatriceBridge/bin/Release/net8.0-windows/win-x64/publish"
          $exe = "$publish/BeatriceBridge.exe"
          $configPath = "$publish/bridge.json"
          $cases = @(
            '{"hotkeys":{"Ctrl+Alt+F1":{"model":"jvs","speakerIndex":0},"Alt+Ctrl+F1":{"model":"jvs","speakerIndex":1}}}',
            '{"hotkeys":{"F1":{"model":"jvs","speakerIndex":0}}}',
            '{"hotkeys":{"Ctrl+Alt+F1":{"model":"official_1","speakerIndex":4}}}',
            '{"hotkeys":{"Ctrl+Alt+F1":{"toggleBypass":true,"model":"jvs"}}}',
            '{"hotkeys":{"Ctrl+Ctrl+Alt+F1":{"model":"jvs","speakerIndex":0}}}',
            '{"hotkeys":{"Ctrl++F1":{"model":"jvs","speakerIndex":0}}}',
            '{"hotkeys":{'
          )
          try {
            foreach ($case in $cases) {
              Set-Content -Path $configPath -Value $case -Encoding utf8
              $process = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow
              if ($process.ExitCode -ne 2) {
                throw "Invalid configuration was not rejected with exit code 2; got $($process.ExitCode). Case: $case"
              }
            }
          }
            Set-Content -Path $configPath -Value '{"hotkeys":{"Ctrl+Alt+F1":{"model":"jvs","speakerIndex":0}}}' -Encoding utf8
            $validProcess = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow
            if ($validProcess.ExitCode -ne 3) {
              throw "Valid configuration was not accepted; expected exit code 3 (API unavailable), got $($validProcess.ExitCode)"
            }
          finally {
            Remove-Item $configPath -Force -ErrorAction SilentlyContinue
          }
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: BeatriceBridge-win-x64
          path: src/BeatriceBridge/bin/Release/net8.0-windows/win-x64/publish/
          if-no-files-found: error
